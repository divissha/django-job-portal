<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
</head>
<body>

<div class="container mt-5" style="max-width:500px;">

    <div class="card shadow">

        <div class="card-body">

            <h2 class="text-center mb-4">
                Login
            </h2>

            <form method="POST">

                {% csrf_token %}

                {{ form.as_p }}

                <button class="btn btn-primary w-100">
                    Login
                </button>

            </form>

        </div>

    </div>

</div>

</body>
</html>
