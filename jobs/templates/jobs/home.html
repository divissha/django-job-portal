<!DOCTYPE html>
<html>
<head>
    <title>Student Job Portal</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-5">

    <h1 class="text-center mb-4">
        Student Job Portal
    </h1>

    {% for job in jobs %}

    <div class="card mb-3">
        <div class="card-body">

            <h3>{{ job.title }}</h3>

            <h5>{{ job.company }}</h5>

            <p>{{ job.description }}</p>

            <a href="{% url 'apply_job' job.id %}" class="btn btn-primary">Apply Now</a>

        </div>
    </div>

    {% endfor %}

</div>

</body>
</html>
